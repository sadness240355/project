<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智能视觉 · 双端监看</title>
<style>body{margin:0;background:#0b111b;color:#dce6f3;font:13px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #26364b;gap:16px;flex-wrap:wrap}h1{font-size:19px;font-weight:500;margin:0}h1 b{color:#53dbc4;font-weight:500}header p{color:#8296ad;font-size:11px;margin:7px 0 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a{font:12px system-ui;padding:9px 13px;background:#1b2a3d;border:1px solid #324760;color:#cfe0f1;border-radius:6px;text-decoration:none;cursor:pointer}button:first-child{background:#207f72;border-color:#369a8a;color:white}button:disabled{opacity:.4;cursor:wait}.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 20px}iframe{width:100%;height:calc(100vh - 145px);min-height:600px;border:1px solid #293b51;border-radius:8px;background:#111c2a}#status{padding:0 24px 8px;font-size:11px;color:#91b2ca}@media(max-width:850px){.views{grid-template-columns:1fr;padding:10px}iframe{height:85vh}header{padding:16px}}</style></head>
<body><header><div><h1>智能视觉 <span> / 双端监看</span></h1><p>左侧 Jetson · 右侧 Mellanox ｜ 同源帧号关联，预览到达时间可能不同</p></div><div class="actions"><button id="start" onclick="run('start')">▶ 开始连续采集</button><button id="stop" onclick="run('stop')">■ 安全停止</button><a href="http://10.23.68.0:8788/" target="_blank">Jetson 工作区 ↗</a><a href="http://10.23.66.188:8788/" target="_blank">Mellanox 工作区 ↗</a></div></header><div class="views"><iframe title="Jetson 视频" src="http://10.23.68.0:8788/?embed=1" allow="fullscreen"></iframe><iframe title="Mellanox 视频" src="http://10.23.66.188:8788/?embed=1" allow="fullscreen"></iframe></div><div id="status">连接控制服务…</div>
<script>let token='',requesting=false;async function refresh(){try{const d=await(await fetch('/status',{cache:'no-store'})).json();token=d.csrf;const c=d.console;document.getElementById('status').textContent=c.message+' · '+(c.capture?.config?.width&&c.capture?.config?.height?c.capture.config.width+' × '+c.capture.config.height:'尺寸未读取')+' · 单帧、像素分析及保存配置请进入工作区';document.getElementById('start').disabled=requesting||c.busy||!c.controller||!c.peer_controller||!!c.sender?.running;document.getElementById('stop').disabled=requesting||c.busy||!c.controller||!c.peer_controller}catch(e){document.getElementById('status').textContent='控制服务连接中断'}}async function run(action){if(requesting)return;requesting=true;try{const r=await fetch('/api/pipeline',{method:'POST',headers:{'Content-Type':'application/json','X-Console-Token':token},body:JSON.stringify({action,config:{fps:120,buffers:8}})});const d=await r.json();document.getElementById('status').textContent=d.message||d.error}catch(e){document.getElementById('status').textContent=e.message}finally{requesting=false;refresh()}}setInterval(refresh,1000);refresh();</script></body></html>
